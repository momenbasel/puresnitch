name: Sync Homebrew tap

# Issue #4: the cask sat at v0.1.0 while the Releases page was on v0.2.0, so
# every `brew install` handed out a build that predated the fixes. This job
# pushes the bump the moment a release is published. The tap also polls on a
# schedule, so a missing token here delays the bump but never loses it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (defaults to the latest release)"
        required: false

permissions:
  contents: read

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release and its DMG
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, never interpolated into the script body: a tag name is
          # attacker-shaped input the moment anyone else can cut a release.
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to act on an unexpected tag: $TAG"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          ASSET="PureSnitch-${VERSION}.dmg"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir .
          SHA=$(sha256sum "$ASSET" | cut -d' ' -f1)
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "asset=$ASSET"
            echo "sha256=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$ASSET sha256=$SHA"

      - name: Dispatch the cask bump
        env:
          # Fine-grained PAT with Contents: write on momenbasel/homebrew-puresnitch.
          TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_DISPATCH_TOKEN is not set; the tap's scheduled bump job will pick this release up instead."
            exit 0
          fi
          # The tap recomputes the checksum from the published asset regardless.
          # This payload only says which release to look at.
          PAYLOAD=$(jq -nc \
            --arg version "$VERSION" \
            --arg sha256 "$SHA256" \
            '{event_type: "puresnitch-release", client_payload: {version: $version, sha256: $sha256}}')
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TAP_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/momenbasel/homebrew-puresnitch/dispatches \
            -d "$PAYLOAD"
          echo "Dispatched cask bump to $VERSION"
